<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<title>Profilo - Biblioshare</title>

<!-- Bootstrap CSS (framework per layout e componenti) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* =========================
   STILE GENERALE DEL BODY
========================= */
body {
    margin: 0;
    background: #0f1117; /* sfondo scuro */
    color: white;        /* testo bianco */
    font-family: Arial;
}

/* =========================
   NAVBAR
========================= */
.navbar {
    background: rgba(0,0,0,0.7); /* semi-trasparente */
    backdrop-filter: blur(10px); /* effetto vetro sfocato */
}

/* =========================
   WRAPPER CENTRALE PAGINA
========================= */
.wrapper {
    min-height: 100vh;              /* occupa tutta l’altezza schermo */
    display: flex;                  /* flexbox per centraggio */
    align-items: center;            /* centra verticalmente */
    justify-content: center;        /* centra orizzontalmente */
    padding: 30px;
}

/* =========================
   CARD PROFILO (effetto glassmorphism)
========================= */
.profile-card {
    width: 100%;
    max-width: 650px;               /* larghezza massima */

    background: rgba(255,255,255,0.08); /* trasparenza */
    backdrop-filter: blur(12px);         /* effetto vetro */

    border-radius: 18px;           /* angoli arrotondati */
    overflow: hidden;              /* taglia contenuti fuori bordo */

    box-shadow: 0 20px 50px rgba(0,0,0,0.6); /* ombra profonda */
}

/* =========================
   HEADER DELLA CARD
========================= */
.card-header {
    background: linear-gradient(90deg, #2563eb, #1d4ed8); /* gradiente blu */
    padding: 20px;
}

/* =========================
   BODY DELLA CARD
========================= */
.card-body {
    padding: 25px;
}

/* =========================
   INPUT FORM
========================= */
.form-control {
    background: rgba(255,255,255,0.08); /* input trasparente */
    border: none;
    color: white;
}

/* quando l’input è selezionato */
.form-control:focus {
    background: rgba(255,255,255,0.12);
    color: white;
    box-shadow: none; /* rimuove bordo blu bootstrap */
}

/* placeholder input */
.form-control::placeholder {
    color: rgba(255,255,255,0.5);
}

/* =========================
   LABEL FORM
========================= */
label {
    font-size: 13px;
    opacity: 0.8;
}

/* =========================
   BOTTONI
========================= */
.btn-success {
    border-radius: 10px;
    padding: 10px;
    font-weight: bold;
}

.btn-secondary {
    border-radius: 10px;
    padding: 10px;
}

/* =========================
   ALERT (messaggi flash)
========================= */
.alert {
    background: rgba(34,197,94,0.15); /* verde trasparente */
    border: 1px solid rgba(34,197,94,0.3);
    color: #86efac;
}

</style>
</head>

<body>

<!-- =========================
     NAVBAR SUPERIORE
========================= -->
<nav class="navbar navbar-dark px-4 py-3 d-flex justify-content-between">

    <!-- Logo / nome sito -->
    <div>
        <b>📚 Biblioshare</b>
    </div>

    <!-- Bottone dashboard -->
    <div>
        <a href="/dashboard" class="btn btn-outline-light btn-sm">
            Dashboard
        </a>
    </div>

</nav>

<!-- =========================
     CONTENITORE CENTRALE
========================= -->
<div class="wrapper">

    <!-- CARD PROFILO -->
    <div class="profile-card">

        <!-- HEADER CARD -->
        <div class="card-header">
            <h3>👤 Il mio profilo</h3>
        </div>

        <!-- BODY CARD -->
        <div class="card-body">

            <!-- =========================
                 MESSAGGI FLASH (Flask)
                 Mostra notifiche temporanee
            ========================= -->
            {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert mb-3">
                    {{ messages[0] }}
                </div>
            {% endif %}
            {% endwith %}

            <!-- =========================
                 FORM PROFILO UTENTE
            ========================= -->
            <form method="POST">

                <!-- Nome -->
                <div class="mb-3">
                    <label>Nome</label>
                    <input class="form-control" name="nome" value="{{utente.nome}}">
                </div>

                <!-- Cognome -->
                <div class="mb-3">
                    <label>Cognome</label>
                    <input class="form-control" name="cognome" value="{{utente.cognome}}">
                </div>

                <!-- Email (solo lettura) -->
                <div class="mb-3">
                    <label>Email</label>
                    <input class="form-control" value="{{utente.email}}" readonly>
                </div>

                <!-- Città -->
                <div class="mb-3">
                    <label>Città</label>
                    <input class="form-control" name="citta" value="{{utente.citta}}">
                </div>

                <!-- Password (opzionale) -->
                <div class="mb-3">
                    <label>Nuova Password</label>
                    <input type="password" class="form-control" name="password"
                        placeholder="Lascia vuoto per non cambiarla">
                </div>

                <!-- Bottone salva -->
                <button class="btn btn-success w-100">
                    💾 Salva modifiche
                </button>

                <!-- Bottone annulla -->
                <a href="/dashboard" class="btn btn-secondary w-100 mt-2">
                    Annulla
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
