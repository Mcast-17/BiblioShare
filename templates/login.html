<!DOCTYPE html>
<!-- Dichiara che il documento è HTML5 -->

<html lang="it">
<!-- Imposta la lingua della pagina su italiano -->

<head>
<!-- Inizio della sezione HEAD: contiene metadati e risorse -->

<meta charset="UTF-8">
<!-- Imposta la codifica dei caratteri (supporta accenti e simboli) -->

<title>Login - Biblioshare</title>
<!-- Titolo della pagina che appare nella scheda del browser -->

<!-- Import di Bootstrap 5 da CDN per avere stili pronti -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* =========================
   STILE GENERALE DEL BODY
========================= */

body {
    margin: 0; /* Rimuove margini predefiniti del browser */
    min-height: 100vh; /* Altezza minima pari all'altezza schermo */
    font-family: Arial; /* Font principale */

    /* Sfondo con overlay scuro + immagine */
    background:
        linear-gradient(135deg, rgba(0,0,0,0.85), rgba(15,23,42,0.95)),
        url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f');

    background-size: cover; /* L'immagine copre tutto lo schermo */
    background-position: center; /* Centra l'immagine */
    color: white; /* Testo bianco */
}

/* =========================
   CENTRATURA CONTENUTO
========================= */

.center-wrap {
    min-height: 100vh; /* Occupa tutta l'altezza */
    display: flex; /* Attiva flexbox */
    align-items: center; /* Centra verticalmente */
    justify-content: center; /* Centra orizzontalmente */
}

/* =========================
   CARD "GLASS EFFECT"
========================= */

.glass-card {
    width: 100%; /* Occupa tutta la larghezza disponibile */
    max-width: 420px; /* Ma non supera 420px */

    background: rgba(255,255,255,0.08); /* Trasparenza tipo vetro */
    backdrop-filter: blur(12px); /* Effetto sfocato dietro */

    border-radius: 18px; /* Angoli arrotondati */
    padding: 30px; /* Spazio interno */

    box-shadow: 0 20px 40px rgba(0,0,0,0.5); /* Ombra morbida */
}

/* =========================
   TITOLO
========================= */

h2 {
    font-weight: bold; /* Testo in grassetto */
    margin-bottom: 20px; /* Spazio sotto il titolo */
}

/* =========================
   INPUT FORM
========================= */

.form-control {
    background: rgba(255,255,255,0.1); /* Sfondo semi-trasparente */
    border: none; /* Rimuove bordo standard */
    color: white; /* Testo bianco */
}

/* Placeholder degli input */
.form-control::placeholder {
    color: rgba(255,255,255,0.6); /* Testo più chiaro */
}

/* Quando l'input è selezionato */
.form-control:focus {
    background: rgba(255,255,255,0.15); /* Più visibile */
    color: white;
    box-shadow: none; /* Rimuove contorno blu Bootstrap */
}

/* =========================
   BOTTONE
========================= */

.btn-primary {
    border-radius: 10px; /* Angoli arrotondati */
    padding: 10px; /* Spazio interno */
    font-weight: bold; /* Testo in grassetto */
}

/* =========================
   LINK
========================= */

a {
    color: #93c5fd; /* Colore azzurro chiaro */
    text-decoration: none; /* Niente sottolineatura */
}

a:hover {
    text-decoration: underline; /* Sottolinea al passaggio mouse */
}

/* =========================
   MESSAGGI FLASH (Flask)
========================= */

.alert {
    background: rgba(255, 193, 7, 0.15); /* Sfondo giallo trasparente */
    border: 1px solid rgba(255, 193, 7, 0.3); /* Bordo giallo */
    color: #ffd966; /* Testo giallo chiaro */
}

</style>
</head>

<body>
<!-- Inizio contenuto visibile della pagina -->

<div class="center-wrap">
<!-- Wrapper che centra tutto -->

    <div class="glass-card">
    <!-- Card principale effetto vetro -->

        <h2 class="text-center">📚 Login Biblioshare</h2>
        <!-- Titolo centrato -->

        <!-- =========================
             MESSAGGI FLASH FLASK
        ========================= -->
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="alert mb-3">
                {{messages[0]}}
            </div>
        {% endif %}
        {% endwith %}
        <!-- Mostra eventuali messaggi (es: errore login) -->

        <!-- =========================
             FORM LOGIN
        ========================= -->
        <form method="POST">
        <!-- Metodo POST per inviare dati al server -->

            <label>Email</label>
            <input type="email" class="form-control mb-3"
                   name="email" placeholder="Inserisci email" required>
            <!-- Campo email obbligatorio -->

            <label>Password</label>
            <input type="password" class="form-control mb-3"
                   name="password" placeholder="Inserisci password" required>
            <!-- Campo password obbligatorio -->

            <button class="btn btn-primary w-100 mt-2">
                Accedi
            </button>
            <!-- Bottone di login -->

        </form>

        <!-- =========================
             LINK REGISTRAZIONE
        ========================= -->
        <div class="text-center mt-3">
            <a href="/register">Non hai un account? Registrati</a>
        </div>

    </div>
</div>

</body>
</html>
