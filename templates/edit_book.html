<!DOCTYPE html>
<html lang="it"> <!-- Documento HTML in lingua italiana -->

<head>
<meta charset="UTF-8"> <!-- Codifica caratteri UTF-8 -->
<title>Modifica libro - Biblioshare</title> <!-- Titolo della pagina -->

<!-- Import Bootstrap per stile e componenti UI -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body {
    background: #0f1117; /* Sfondo scuro */
    color: white; /* Testo bianco */
    font-family: Arial; /* Font principale */
}

/* CONTENITORE CENTRATO */
.wrapper {
    min-height: 100vh; /* Altezza piena schermo */
    display: flex; /* Flexbox */
    align-items: center; /* Centra verticalmente */
    justify-content: center; /* Centra orizzontalmente */
}

/* CARD EDITOR */
.editor-card {
    width: 100%; /* Occupa tutto lo spazio disponibile */
    max-width: 600px; /* Larghezza massima */

    background: #1c1f2a; /* Sfondo scuro della card */
    border-radius: 16px; /* Angoli arrotondati */
    padding: 25px; /* Spazi interni */

    box-shadow: 0 20px 40px rgba(0,0,0,0.4); /* Ombra per profondità */
}

/* STILE INPUT */
.form-control {
    background: rgba(255,255,255,0.08); /* Sfondo semi-trasparente */
    border: none; /* Nessun bordo */
    color: white; /* Testo bianco */
}

/* STATO FOCUS INPUT */
.form-control:focus {
    background: rgba(255,255,255,0.12); /* Sfondo leggermente più chiaro */
    color: white; /* Testo bianco */
    box-shadow: none; /* Rimuove glow Bootstrap */
}

/* PLACEHOLDER INPUT */
.form-control::placeholder {
    color: rgba(255,255,255,0.5); /* Testo placeholder grigio chiaro */
}

/* TEXTAREA (descrizione libro) */
textarea.form-control {
    min-height: 120px; /* Altezza minima */
    resize: none; /* Disabilita ridimensionamento */
}

/* TITOLO PAGINA */
h2 {
    margin-bottom: 20px; /* Spazio sotto il titolo */
}

/* BOTTONE SALVATAGGIO */
.btn-primary {
    width: 100%; /* Occupa tutta la larghezza */
    padding: 10px; /* Spazi interni */
    border-radius: 10px; /* Angoli arrotondati */
    font-weight: bold; /* Testo in grassetto */
}

</style>
</head>

<body>

<!-- CONTENITORE CENTRATO DELLA PAGINA -->
<div class="wrapper">

    <!-- CARD DEL FORM DI MODIFICA -->
    <div class="editor-card">

        <!-- TITOLO PAGINA -->
        <h2>✏️ Modifica libro</h2>

        <!-- FORM DI MODIFICA (POST verso backend) -->
        <form method="POST">

            <!-- INPUT TITOLO (invia il nome al server con il valore precompilato-->
            <input
                name="titolo" 
                value="{{ libro.titolo }}" 
                class="form-control mb-3" 
                placeholder="Titolo">

            <!-- INPUT AUTORE -->
            <input
                name="autore"
                value="{{ libro.autore }}"
                class="form-control mb-3"
                placeholder="Autore">

            <!-- INPUT CATEGORIA -->
            <input
                name="categoria"
                value="{{ libro.categoria }}"
                class="form-control mb-3"
                placeholder="Categoria">

            <!-- INPUT ANNO -->
            <input
                name="anno"
                value="{{ libro.anno }}"
                class="form-control mb-3"
                placeholder="Anno">

            <!-- TEXTAREA DESCRIZIONE -->
            <textarea name="descrizione" class="form-control mb-3" placeholder="Descrizione">{{ libro.descrizione }} </textarea>

            <!-- BOTTONE SUBMIT -->
            <button class="btn btn-primary">
                💾 Aggiorna libro
            </button>

        </form>

    </div>

</div>

</body>
</html>
