<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<title>I miei libri - Biblioshare</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body {
    background: #0f1117;
    color: white;
    font-family: Arial;
}

/* HEADER */
.header {
    padding: 30px 20px 10px;
}

/* STATS */
.stats-row {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin: 10px 20px 20px;
}

.stat-box {
    background: rgba(255,255,255,0.08);
    padding: 15px;
    border-radius: 12px;
    min-width: 160px;
}

/* BOTTONE */
.btn-add {
    margin: 10px 20px;
}

/* GRID */
.book-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 15px;
    padding: 20px;
}

/* CARD */
.book-card {
    background: #1c1f2a;
    border-radius: 14px;
    padding: 15px;
    transition: 0.3s;
    position: relative;
    min-height: 180px;
}

.book-card:hover {
    transform: scale(1.03);
    background: #2a2f3d;
}

/* ACTIONS */
.actions {
    margin-top: 15px;
    display: flex;
    gap: 10px;
}

.actions a {
    font-size: 12px;
}

h2 {
    margin: 20px;
}

</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
    <h2>📚 I miei libri</h2>
</div>

<!-- STATS -->
<div class="stats-row">

    <div class="stat-box">
        <div>Stato sistema</div>
        <b>Attivo</b>
    </div>

    <div class="stat-box">
        <div>Prestiti</div>
        <b>{{ prestiti_utente }}</b>
    </div>

    <div class="stat-box">
        <div>Totale libri</div>
        <b>{{ libri|length }}</b>
    </div>

</div>

<!-- BOTTONE -->
<a href="/add_book" class="btn btn-success btn-add">
    ➕ Aggiungi libro
</a>

<!-- GRID LIBRI -->
<div class="book-grid">

    {% for l in libri %}
    <div class="book-card">

        <!-- COPERTINA -->
        <img src="{{ url_for('static', filename='covers/' + l.copertina) }}"
     style="width:120px;height:160px;object-fit:cover;"
     onerror="this.src='{{ url_for('static', filename='covers/default_book.jpg') }}'">
			
        <!-- TITOLO -->
        <h5>{{ l.titolo }}</h5>

        <!-- AUTORE -->
        <p><b>Autore:</b> {{ l.autore }}</p>

        <!-- CATEGORIA -->
        <p><b>Categoria:</b> {{ l.categoria }}</p>

        <!-- AZIONI -->
        <div class="actions">

            <a href="/edit_book/{{ l.id_libro }}" class="btn btn-warning btn-sm">
                Modifica
            </a>

            <a href="/delete_book/{{ l.id_libro }}" class="btn btn-danger btn-sm">
                Elimina
            </a>

        </div>

    </div>
    {% endfor %}

</div>

</body>
</html>
