<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<title>Aggiungi libro - Biblioshare</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body {
    background: #0f1117;
    color: white;
    font-family: Arial;
}

.wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.form-card {
    width: 100%;
    max-width: 550px;

    background: #1c1f2a;
    border-radius: 16px;
    padding: 25px;

    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}

.form-control {
    background: rgba(255,255,255,0.08);
    border: none;
    color: white;
}

.form-control:focus {
    background: rgba(255,255,255,0.12);
    color: white;
    box-shadow: none;
}

.form-control::placeholder {
    color: rgba(255,255,255,0.5);
}

textarea.form-control {
    min-height: 120px;
    resize: none;
}

h2 {
    margin-bottom: 20px;
}

.btn-success {
    width: 100%;
    padding: 10px;
    font-weight: bold;
    border-radius: 10px;
}

</style>
</head>

<body>

<div class="wrapper">

    <div class="form-card">

        <h2>➕ Aggiungi nuovo libro</h2>

        <!-- FORM -->
        <form method="POST" enctype="multipart/form-data">

            <input name="titolo"
                   placeholder="Titolo"
                   class="form-control mb-3">

            <input name="autore"
                   placeholder="Autore"
                   class="form-control mb-3">

            <input name="categoria"
                   placeholder="Categoria"
                   class="form-control mb-3">

            <input name="anno"
                   placeholder="Anno"
                   class="form-control mb-3">

            <textarea name="descrizione"
                      placeholder="Descrizione"
                      class="form-control mb-3"></textarea>

            <!-- COPERTINA -->
            <input type="file"
                   name="copertina"
                   class="form-control mb-3">

            <button class="btn btn-success">
                💾 Salva libro
            </button>

        </form>

    </div>

</div>

</body>
</html>
