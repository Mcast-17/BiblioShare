<!DOCTYPE html>
<!-- Dichiara che il documento è HTML5 -->

<html lang="it">
<!-- Lingua della pagina impostata su italiano -->

<head>
<!-- Inizio sezione HEAD: contiene metadati e risorse -->

<meta charset="UTF-8">
<!-- Supporto caratteri UTF-8 (accenti, simboli, ecc.) -->

<title>Registrazione - Biblioshare</title>
<!-- Titolo che appare nella scheda del browser -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Importa Bootstrap 5 per layout e componenti CSS già pronti -->

<style>
/* =======================
   STILI PERSONALIZZATI
   ======================= */

/* STILE GENERALE DEL BODY */
body {
    margin: 0; /* elimina margini default */
    min-height: 100vh; /* altezza minima pari allo schermo intero */
    font-family: Arial; /* font principale */

    /* sfondo con overlay scuro + immagine */
    background:
        linear-gradient(135deg, rgba(0,0,0,0.85), rgba(15,23,42,0.95)),
        url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f');

    background-size: cover; /* l'immagine copre tutto lo schermo */
    background-position: center; /* centra l'immagine */
    color: white; /* testo bianco */
}

/* CONTENITORE CENTRATO */
.center-wrap {
    min-height: 100vh; /* occupa tutta l'altezza */
    display: flex; /* abilita flexbox */
    align-items: center; /* centra verticalmente */
    justify-content: center; /* centra orizzontalmente */
}

/* CARD EFFETTO VETRO (GLASSMORPHISM) */
.glass-card {
    width: 100%;
    max-width: 450px; /* larghezza massima della card */

    background: rgba(255,255,255,0.08); /* trasparenza */
    backdrop-filter: blur(12px); /* effetto sfocatura vetro */

    border-radius: 18px; /* angoli arrotondati */
    padding: 30px; /* spazio interno */

    box-shadow: 0 20px 40px rgba(0,0,0,0.4); /* ombra */
}

/* TITOLO */
h2 {
    font-weight: bold; /* testo in grassetto */
    margin-bottom: 25px; /* spazio sotto il titolo */
}

/* CAMPI INPUT */
.form-control {
    background: rgba(255,255,255,0.1); /* sfondo semi trasparente */
    border: none; /* nessun bordo */
    color: white; /* testo bianco */
}

/* placeholder degli input */
.form-control::placeholder {
    color: rgba(255,255,255,0.6); /* colore chiaro e trasparente */
}

/* effetto quando si clicca su un input */
.form-control:focus {
    background: rgba(255,255,255,0.15); /* leggermente più chiaro */
    color: white;
    box-shadow: none; /* rimuove ombra blu bootstrap */
}

/* BOTTONE */
.btn-primary {
    border-radius: 10px; /* bordi arrotondati */
    padding: 10px; /* spazio interno */
    font-weight: bold; /* testo in grassetto */
}

/* LINK */
a {
    color: #93c5fd; /* colore azzurro */
    text-decoration: none; /* niente sottolineatura */
}

/* hover del link */
a:hover {
    text-decoration: underline; /* sottolinea al passaggio mouse */
}

</style>

</head>

<body>
<!-- Inizio contenuto visibile della pagina -->

<div class="center-wrap">
<!-- wrapper che centra tutto nella pagina -->

    <div class="glass-card">
    <!-- card centrale con effetto vetro -->

        <h2 class="text-center">📚 Registrazione</h2>
        <!-- titolo della pagina -->

        <form method="POST">
        <!-- form che invia i dati al server con metodo POST -->

            <input class="form-control mb-3" name="nome" placeholder="Nome" required>
            <!-- campo nome -->

            <input class="form-control mb-3" name="cognome" placeholder="Cognome" required>
            <!-- campo cognome -->

            <input class="form-control mb-3" type="email" name="email" placeholder="Email" required>
            <!-- campo email (validazione automatica email) -->

            <input class="form-control mb-3" type="password" name="password" placeholder="Password" required>
            <!-- campo password (testo nascosto) -->

            <input class="form-control mb-3" name="citta" placeholder="Citta" required>
            <!-- campo città -->

            <button class="btn btn-primary w-100 mt-2">
                Registrati
            </button>
            <!-- bottone invio form -->

        </form>

        <div class="text-center mt-3">
        <!-- sezione link login -->

            <a href="/login">Hai già un account? Accedi</a>
            <!-- link alla pagina di login -->

        </div>

    </div>

</div>

</body>
</html>
